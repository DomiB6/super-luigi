<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Super Luigi – Kampf um die Champions League</title>
  <link rel="stylesheet" href="style.css?v=8" />
</head>
<body data-game-state="unlock">
  <div id="game-shell">
    <canvas id="game" width="320" height="180" aria-label="Super Luigi Spiel"></canvas>

    <div id="touch-controls" class="hidden" aria-label="Touch-Steuerung">
      <!-- Nur in der Charakterwahl sichtbar -->
      <div class="touch-menu-dpad" aria-label="Menü-Navigation">
        <button data-action="up" class="dpad-up" aria-label="Oben">▲</button>
        <button data-action="left" class="dpad-left" aria-label="Links">◀</button>
        <button data-action="right" class="dpad-right" aria-label="Rechts">▶</button>
        <button data-action="down" class="dpad-down" aria-label="Unten">▼</button>
      </div>

      <!-- Im eigentlichen Spiel wie bisher -->
      <div class="touch-left touch-play-move">
        <button data-action="left" aria-label="Links laufen">◀</button>
        <button data-action="right" aria-label="Rechts laufen">▶</button>
      </div>
      <div class="touch-right">
        <button data-action="shoot" aria-label="Schiessen">⚽</button>
        <button data-action="jump" aria-label="Springen">▲</button>
      </div>
    </div>
  </div>

  <div id="rotate-overlay" aria-hidden="true">
    <div class="rotate-card">
      <div class="rotate-icon">↻</div>
      <strong>Handy bitte quer halten</strong>
      <span>Das Spiel ist für das Querformat optimiert.</span>
    </div>
  </div>

  <script src="game.js?v=8"></script>
</body>
</html>
